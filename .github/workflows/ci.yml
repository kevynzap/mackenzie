name: CI

on:
    push:
        branches: 
            - main
    
    pull_request:
        branches:
            - main
    
    jobs:
        test:

            runs-on: ubuntu-latest

            steps:
                - name: Baixa código 
                  uses: actions/checkout@v4
                
                - name: Instalar Python 
                  uses: actions/steup-python@v5
                  with:
                    python-version: '3.12'
                
                - name: Instalar dependências
                  run: pip install -r requirements.txt

                -name: Executar testes
                 run: pytest